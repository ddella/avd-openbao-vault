[defaults]
host_key_checking = False
gather_facts = False
# Parallel workers (default 5). AVD config generation is CPU-bound, so there's
# little gain beyond the number of CPU cores; 12 = one worker per switch here.
forks = 8
result_format=yaml
callback_result_format = yaml

# Load global_vars/ for all hosts (lower precedence than group_vars/host_vars).
# DO NOT remove host_group_vars.
vars_plugins_enabled = arista.avd.global_vars, host_group_vars

[vars_global_vars]
# Relative to inventories/<environment>/inventory.yml
paths = ../../global_vars, ../../group_vars, _common_vars

[hashi_vault_collection]
# Works unchanged against OpenBao (same API). Auth/URL come from
# VAULT_ADDR / VAULT_TOKEN env vars unless overridden here.
auth_method = token

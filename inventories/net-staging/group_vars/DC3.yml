---
bao_dc: dc3
mgmt_gateway: 172.17.3.1

spine:
  defaults:
    platform: vEOS-lab
    loopback_ipv4_pool: 10.255.4.0/27
    bgp_as: 65300
  nodes:
    - name: dc3-spine1
      id: 1
      mgmt_ip: 172.17.3.11/24
    - name: dc3-spine2
      id: 2
      mgmt_ip: 172.17.3.12/24

l3leaf:
  defaults:
    platform: vEOS-lab
    loopback_ipv4_pool: 10.255.4.0/27
    loopback_ipv4_offset: 2
    vtep_loopback_ipv4_pool: 10.255.5.0/27
    uplink_interfaces: [Ethernet1, Ethernet2]
    uplink_switches: [dc3-spine1, dc3-spine2]
    uplink_ipv4_pool: 10.255.255.128/26
    virtual_router_mac_address: 00:1c:73:00:00:99
    spanning_tree_mode: mstp
  node_groups:
    - group: DC3_LEAF1
      bgp_as: 65301
      nodes:
        - name: dc3-leaf1
          id: 1
          mgmt_ip: 172.17.3.101/24
          uplink_switch_interfaces: [Ethernet1, Ethernet1]
    - group: DC3_LEAF2
      bgp_as: 65302
      nodes:
        - name: dc3-leaf2
          id: 2
          mgmt_ip: 172.17.3.102/24
          uplink_switch_interfaces: [Ethernet2, Ethernet2]

---
#####################################################################
############################### build ###############################
#####################################################################

# ansible-playbook playbooks/build.yml -i inventories/net-prod/inventory.yml -e "bao_env=net-prod"
# ansible-playbook playbooks/build.yml -i inventories/net-prod/inventory.yml -e "bao_env=net-prod" --limit DC1,DC2
# make build ENV=net-prod DC=DC1

- name: "🏗️  Build Switch configuration for {{ ENV | default(bao_env | default('all hosts')) }}"
  hosts: all
  gather_facts: false

  tasks:
    - name: 🖨 Print selected environment
      ansible.builtin.debug:
        msg: "ENV={{ ENV | default(bao_env | default('undefined')) }}"
      run_once: true

    # Only the DCs of the hosts in this run (--limit) need their secrets.
    # A token scoped to some DCs (e.g. dc1+dc3, see 04_Users.md) can't read
    # the others, so we must not even try.
    - name: 🧭 Find which DC secrets this run needs
      ansible.builtin.set_fact:
        _bao_needed_dcs: >-
          {{ ansible_play_hosts_all | map('extract', hostvars)
             | selectattr('bao_dc', 'defined') | map(attribute='bao_dc') | unique }}
      run_once: true

    - name: 🖨 Print DCs fetched from OpenBao
      ansible.builtin.debug:
        msg: "Fetching dc/<dc>/* secrets for: {{ _bao_needed_dcs | join(', ') }}"
      run_once: true

    # The _bao_* vars in global_vars/secret.yml are lazy lookups: Ansible
    # re-runs the lookup every time they are templated (thousands of times
    # inside AVD). Resolve each secret ONCE here; run_once + set_fact applies
    # the facts to every host, and facts outrank global_vars.
    #
    # DCs outside the limit get a placeholder instead of an OpenBao call.
    # eos_designs still templates those hosts' vars (cross-DC facts) but
    # writes no config for them, so the placeholder never reaches an output.
    - name: 🧲 Fetch secrets from OpenBao once
      ansible.builtin.set_fact:
        _bao_global_aaa: "{{ _bao_global_aaa }}"
        _bao_global_security: "{{ _bao_global_security }}"
        _bao_global_snmp: "{{ _bao_global_snmp }}"
        _bao_dc1_bgp: "{{ _bao_dc1_bgp if 'dc1' in _bao_needed_dcs else _bao_dc_not_fetched }}"
        _bao_dc2_bgp: "{{ _bao_dc2_bgp if 'dc2' in _bao_needed_dcs else _bao_dc_not_fetched }}"
        _bao_dc3_bgp: "{{ _bao_dc3_bgp if 'dc3' in _bao_needed_dcs else _bao_dc_not_fetched }}"
        _bao_global_users: "{{ _bao_global_users }}"
      vars:
        _bao_dc_not_fetched:
          underlay_password: NOT-FETCHED-outside-limit
          overlay_password: NOT-FETCHED-outside-limit
          mlag_password: NOT-FETCHED-outside-limit
          evpn_route_server_password: NOT-FETCHED-outside-limit
      run_once: true
      no_log: true

    # With --limit, eos_designs still templates the vars of EVERY fabric host
    # (to build cross-DC facts). Hosts outside the limit didn't get the facts
    # above, so their _bao_* vars would fall back to lazy lookups again.
    # Copy the already-resolved values to them (no extra OpenBao calls: vars
    # are templated in the context of the play host, which has the facts).
    - name: 🧲 Share resolved secrets with hosts outside --limit
      ansible.builtin.set_fact:
        _bao_global_aaa: "{{ _bao_global_aaa }}"
        _bao_global_security: "{{ _bao_global_security }}"
        _bao_global_snmp: "{{ _bao_global_snmp }}"
        _bao_dc1_bgp: "{{ _bao_dc1_bgp }}"
        _bao_dc2_bgp: "{{ _bao_dc2_bgp }}"
        _bao_dc3_bgp: "{{ _bao_dc3_bgp }}"
        _bao_global_users: "{{ _bao_global_users }}"
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ groups['all'] | difference(ansible_play_hosts_all) }}"
      run_once: true
      no_log: true

    - name: 🚀 Generate Structured Variables per Device
      ansible.builtin.import_role:
        name: arista.avd.eos_designs

    - name: 🚀 Generate Intended Config and Documentation
      ansible.builtin.import_role:
        name: arista.avd.eos_cli_config_gen

#      vars:
#        # Vault ID used for encrypting temporary files generated by the role.
#        # When Ansible Vault is not configured, this parameter has no effect and files are written as plain JSON.
#        # When Ansible Vault is configured, AVD encrypts files containing templated and validated data
#        # to prevent sensitive information from being exposed in the temporary directories.
#        #   * When `avd_vault_id` is not specified, AVD uses the *first* Vault ID in the list for encryption.
#        #   * When `avd_vault_id` is specified, AVD uses the specified Vault ID for encryption.
#        eos_cli_config_gen_configuration:
#          # Generate device EOS configurations.
#          enable: false
#          # Replace the input data using the `hide_passwords` filter in the Jinja2 templates
#          # by '<removed>' in the configuration if true.
#          hide_passwords: true

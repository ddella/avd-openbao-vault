---
#####################################################################
############################# cv_deploy #############################
#####################################################################
# https://avd.arista.com/6.5/ansible_collections/arista/avd/roles/cv_deploy/index.html

# ‼️IMPORTANT‼️ ‼️IMPORTANT‼️ ‼️IMPORTANT‼️ ‼️IMPORTANT‼️ ‼️IMPORTANT‼️ ‼️IMPORTANT‼️ ‼️IMPORTANT‼️
# Python requests library used by AVD's CloudVision modules does not use your operating system's certificate trust store.
# Python uses its own bundled CA database (certifi) and completely ignores the root certificates you imported into the OS.

# Force Python/requests to use the OS trust store instead of its own built-in one
# ENV REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
# ENV SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
### ⛔⛔⛔ Append certificates to the user 'avd' Python environment
# This is the most robust way
# 👉 cat /usr/local/share/ca-certificates/*.crt | sudo tee -a $(python3 -m certifi)

- name: Configuration deployment
  hosts: "{{ container_root }}"
  connection: local
  gather_facts: false

  ### Load the encrypted files. We have a main Vault and each users have it's personnal vault for CV token
  # 👉 The path is relative to the Playbooks directory 👈
  pre_tasks:
    - name: 🚀 Load and merge Vault files
      ansible.builtin.import_tasks: ../common_tasks/load_Vaults.yml

  tasks:
    - name: Dynamically get installed Arista AVD version
      shell: ansible-galaxy collection list arista.avd | grep "arista.avd" | awk '{print $2}'
      register: avd_version_cmd
      changed_when: false

    - name: Save AVD version as a variable
      set_fact:
        avd_version: "{{ avd_version_cmd.stdout | trim }}"

    - name: Dynamically get installed Python version
      shell: python -V | awk '{print $2}'
      register: python_version_cmd
      changed_when: false

    - name: Save Python version as a variable
      set_fact:
        python_version: "{{ python_version_cmd.stdout | trim }}"

    ### Deploy on CVP/CVaaS ###
    - name: 🎯 Deploy Configurations and tags to CVP/CloudVision
      run_once: true
      ansible.builtin.import_role:
        name: arista.avd.cv_deploy
      vars:
        # Set the CV server hostname and token from Ansible Vault.
        cv_server: "{{ vault.cvp.server }}"
        cv_token: "{{ vault.personal.cvp_token.service_token }}"
        # Verify Certificate for CloudVision (Always use valid certificates for production)
        cv_verify_certs: true
        # Set the template to be used to generate the configlet names in CloudVision Static Config Studio.
        cv_configlet_name_template: "avd-{{ avd_version }}-${hostname}"
        # Approve, start and wait for the Change Control to Complete. Otherwise the Change Control will be
        # left in "pending approval" mode.
        # Only applicable if cv_submit_workspace is true.
        cv_run_change_control: false
        # Submit Workspace on deployment. default is true,setting it to false, the Workspace will be left in
        # "pending" mode and submitted after verification
        cv_submit_workspace: false

        # Remove any tags on the devices and interfaces not specified by AVD.
        # WARNING: This may remove tags used for studios and other things, so this is *not* recommended.
        # NOTICE: For tags set by AVD any other tags with the same label will _always_ be removed. This is not configurable.
        # ✅ THIS IS OK ✅
        cv_strict_tags: false

        # Set the name of the created Workspace. By default this will be "AVD <date and time>"
        # Workspace Name: Concise and searchable
        cv_workspace_name: "🚧 avd {{ avd_version }} | {{ now(fmt='%Y-%m-%d %H:%M') }} | {{ container_root }}"

        # Set the description of the created Workspace.
        # Workspace Description: Multi-line rich text for full context in CloudVision
        cv_workspace_description: >-
          📝 AVD Configuration Push
          👤 Engineer: {{ engineer_name | default(lookup('env', 'USER') | default('Automated Runner', true)) }}
          📅 Date/Time: {{ now(fmt='%Y-%m-%d %H:%M:%S %Z') }}
          🚀 AVD Version: {{ avd_version }}
          🐍 Python Version: {{ python_version }}
          💻 Execution Host: {{ lookup('pipe', 'hostname') | default('Unknown', true) }}
          🐳 Docker Image: {{ lookup('env', 'AVD_DEV_CONTAINER') | default('Unknown Image', true) }}
          📦 Inventory: "{{ container_root }}"

        # Set the name of the created Change Control. By default this will be auto generated by
        # CloudVision based on the workspace name.
        # cv_change_control_name: "{{ container_root }}_cv_deploy"
        # Set the description of the created Change Control.
        # cv_change_control_description: "{{ lookup('ansible.builtin.env', 'CHANGE_CONTROL_DESCRIPTION') }}"

        # If true, detailed deployment results will be registered into 'cv_deploy_results' variable.
        # Otherwise only the basic result like 'failed', 'warnings' and 'errors' are registered.
        # There is a small performance impact on this, which is why it is not registered by default.
        # cv_register_detailed_results: true

#    - name: Print the entire cv_deploy_results object
#      ansible.builtin.debug:
#        var: cv_deploy_results

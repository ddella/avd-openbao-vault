---
# It discovers existing secret categories, reads their values,
# and prints them in a YAML-shaped report. Secret-reading tasks
# are hidden from intermediate Ansible output;
# printing the final report requires explicit confirmation.

# For production, run it from the shell where Bao is logged in:
#   export VAULT_ADDR=https://openbao.kloud.lan:8200
#   export BAO_ADDR="$VAULT_ADDR"
#   CERT_PATH="$(realpath bao-cert/openbao.kloud.lan-chain.pem)"
#   export VAULT_CACERT="$CERT_PATH"
#   export BAO_CACERT="$CERT_PATH"
#   ansible-playbook -i inventories/net-prod/inventory.yml \
#     playbooks/troubleshoot-secrets.yml \
#     -e "bao_env=net-prod confirm_secret_output=true"

- name: Troubleshoot OpenBao secret reads
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    supported_bao_envs:
      - net-prod
      - net-staging
      - net-lab
  tasks:
    - name: Require a supported environment
      ansible.builtin.assert:
        that:
          - (bao_env | default('')) in supported_bao_envs
        fail_msg: "Pass bao_env=net-prod, net-staging, or net-lab with --extra-vars."

    - name: Require explicit confirmation before printing secrets
      ansible.builtin.assert:
        that:
          - confirm_secret_output | default(false) | bool
        fail_msg: >-
          This playbook prints every readable secret to stdout. Re-run with
          confirm_secret_output=true only from a trusted terminal, not CI logs.

    - name: List environment-wide categories
      ansible.builtin.command:
        argv:
          - bao
          - kv
          - list
          - -format=json
          - "-mount={{ bao_env }}"
          - global
      register: bao_global_categories
      changed_when: false

    - name: List datacenters
      ansible.builtin.command:
        argv:
          - bao
          - kv
          - list
          - -format=json
          - "-mount={{ bao_env }}"
          - dc
      register: bao_datacenters
      changed_when: false

    - name: List secret categories for each datacenter
      ansible.builtin.command:
        argv:
          - bao
          - kv
          - list
          - -format=json
          - "-mount={{ bao_env }}"
          - "dc/{{ item }}"
      loop: "{{ bao_datacenters.stdout | from_json }}"
      loop_control:
        label: "dc/{{ item }}"
      register: bao_dc_categories
      changed_when: false

    - name: Initialize paths from environment-wide categories
      ansible.builtin.set_fact:
        bao_secret_paths: >-
          {{ bao_global_categories.stdout | from_json
            | map('regex_replace', '^', 'global/') | list }}

    - name: Add per-datacenter secret paths
      ansible.builtin.set_fact:
        bao_secret_paths: >-
          {{ bao_secret_paths + (item.stdout | from_json
            | map('regex_replace', '^', 'dc/' ~ item.item ~ '/') | list) }}
      loop: "{{ bao_dc_categories.results }}"
      loop_control:
        label: "dc/{{ item.item }}"

    - name: Read every secret as JSON
      ansible.builtin.command:
        argv:
          - bao
          - kv
          - get
          - -format=json
          - "-mount={{ bao_env }}"
          - "{{ item }}"
      loop: "{{ bao_secret_paths }}"
      loop_control:
        label: "{{ item }}"
      register: bao_secret_reads
      changed_when: false
      failed_when: false
      no_log: true

    - name: Check that every listed secret is readable
      ansible.builtin.assert:
        that:
          - item.rc == 0
        fail_msg: >-
          Could not read {{ bao_env }}/{{ item.item }}. Check the secret path
          and that your token has read access to {{ bao_env }}/data/*.
      loop: "{{ bao_secret_reads.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Assemble environment-wide secret data
      ansible.builtin.set_fact:
        bao_global_data: >-
          {{ (bao_global_data | default({})) | combine({
            item.item.split('/')[1]: (item.stdout | from_json).data.data
          }) }}
      loop: "{{ bao_secret_reads.results | selectattr('item', 'match', '^global/') | list }}"
      loop_control:
        label: "{{ item.item }}"
      # no_log: true
      no_log: false

    - name: Assemble datacenter secret data
      ansible.builtin.set_fact:
        bao_dc_data: >-
          {{ (bao_dc_data | default({})) | combine({
            item.item.split('/')[1]: {
              item.item.split('/')[2]: (item.stdout | from_json).data.data
            }
          }, recursive=true) }}
      loop: "{{ bao_secret_reads.results | selectattr('item', 'match', '^dc/') | list }}"
      loop_control:
        label: "{{ item.item }}"
      # no_log: true
      no_log: false

    - name: Assemble YAML report
      ansible.builtin.set_fact:
        bao_secrets_report:
          environment: "{{ bao_env }}"
          global: "{{ bao_global_data | default({}) }}"
          datacenters: "{{ bao_dc_data | default({}) }}"
      no_log: true

    - name: Print secrets as YAML
      ansible.builtin.debug:
        var: bao_secrets_report

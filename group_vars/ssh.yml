---
#####################################################################
############################### SSH #################################
#####################################################################
# https://avd.arista.com/6.5/ansible_collections/arista/avd/roles/eos_designs/docs/data-models.html#ssh
ssh_vrf_name: "use_mgmt_interface_vrf"
ssh_settings_enabled: true
ssh_settings:
  # Explicitly enable or disable management ssh for all VRFs. By default EOS enables management ssh for all VRFs.
  enabled: "{{ ssh_settings_enabled }}"
  vrfs:
    - name: "{{ ssh_vrf_name }}"
      enabled: true
      ipv4_acl: "vty"
  # Idle timeout in minutes.
  idle_timeout: 30

  client_vrfs:
    # VRF name.
    # The value will be interpreted according to these rules:
    # - `use_mgmt_interface_vrf` will configure SSH for the VRF set with `mgmt_interface_vrf`.
    #   An error will be raised if `mgmt_ip` or `ipv6_mgmt_ip` are not configured for the device.
    # - `use_inband_mgmt_vrf` will configure SSH for the VRF set with `inband_mgmt_vrf`.
    #   An error will be raised if inband management is not configured for the device.
    # - `use_default_mgmt_method_vrf` will configure the VRF for one of the two options above depending
    #   on the value of `default_mgmt_method`.
    # - Any other string will be used directly as the VRF name.
    - name: "{{ ssh_vrf_name }}"
    # Source interface to use for IP SSH Client in this VRF.
    # If set, the value is used directly as the source interface name.
    # If not set, the source interface is derived automatically when `name` is set to `use_mgmt_interface_vrf`,
    # `use_inband_mgmt_vrf` or `use_default_mgmt_method_vrf`.
    # For any other `name` value, `source_interface` must be set.
    # source_interface: <str>

# 👉 Not yet in AVD design 👈
custom_structured_configuration_management_ssh:
  connection:
    limit: 30
    per_host: 10

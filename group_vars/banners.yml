---
#####################################################################
############################# BANNERS ###############################
#####################################################################
# https://avd.arista.com/6.5/ansible_collections/arista/avd/roles/eos_designs/docs/data-models.html#other-management-settings
management_settings:
  # console:
  #   idle_timeout: <int; 0-86400>
  banners:
    # Informational or operational message displayed to authorized users after a successful login.
    motd: |
      hostname       : {{ inventory_hostname }}
      *** SYSTEM NOTICE: Scheduled maintenance tonight at 02:00 UTC ***
      EOF
    # Legal notification or security warning displayed to all users before authentication.
    login: |
      #################################################################
      #                   _    _           _   _                      #
      #                  / \  | | ___ _ __| |_| |                     #
      #                 / _ \ | |/ _ \ '__| __| |                     #
      #                / ___ \| |  __/ |  | |_|_|                     #
      #               /_/   \_\_|\___|_|   \__(_)                     #
      #                                                               #
      #  You are entering into a secured area! Your IP, Login Time,   #
      #   Username has been noted and has been sent to the server     #
      #                       administrator!                          #
      #   This service is restricted to authorized users only. All    #
      #            activities on this system are logged.              #
      #  Unauthorized access will be fully investigated and reported  #
      #        to the appropriate law enforcement agencies.           #
      #################################################################
      EOF

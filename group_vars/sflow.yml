---
#####################################################################
################################ sFlow ##############################
#####################################################################
# https://avd.arista.com/6.5/ansible_collections/arista/avd/roles/eos_cli_config_gen/docs/data-models.html#sflow
# Define the standard Ansible variable
mycustom_sflow_vrfs:
  - name: default
    destinations:
      - destination: 127.0.0.1
    source_interface: Loopback0

# Reference the variable in the structured config
custom_structured_configuration_sflow:
  sample: 16384
  polling_interval: 10
  extensions:
    - name: bgp
      enabled: true
  run: true
  vrfs: "{{ mycustom_sflow_vrfs }}"

# https://avd.arista.com/6.4/ansible_collections/arista/avd/roles/eos_designs/docs/data-models.html#sflow
sflow_settings:
  destinations:
    - destination: 127.0.0.1

# https://avd.arista.com/6.4/ansible_collections/arista/avd/roles/eos_designs/docs/data-models.html#sflow

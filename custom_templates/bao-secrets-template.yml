---
# Copy to bao-secrets-net-<env>.yml, set the environment, then fill it in.
# Map global.<category> to <environment>/global/<category>.
# Map datacenters.<dc>.<category> to <environment>/dc/<dc>/<category>.
# Null means unset; optional null fields should be omitted by the importer.
# ⛔ Do not Git commit populated copies of this file. ⛔

environment: net-prod

global:
  aaa:
    tacacs:
      servers:
        server1:
          key: null
        server2:
          key: null
    radius:
      servers:
        server1:
          key: null
        server2:
          key: null
    enable:
      password: null

  users:
    admin:
      password: null
      sha512_password: null
    cvpadmin:
      password: null
    user1:
      ssh_keys:
        primary: null
        secondary: null

  eapi:
    username: null
    password: null

  snmp:
    snmpv2:
      community1: null
      community2: null
    snmpv3:
      user1:
        auth: null
        priv: null
      user2:
        auth: null
        priv: null

  security:
    macsec:
      mka_key: null #  optional
    ipsec:
      profile1:
        key: null # optional
    ntp:
      auth_keys:
        key1: null # optional
        key2: null # optional

  cvp:
    server: null
    username: null # optional when using tokens only
    password: null
    service_token: null
    onboarding_token: null

  syslog:
    tls_key: null # optional

  certificates:
    https_private_key: null

datacenters:
  dc1:
    bgp:
      underlay_password: null
      overlay_password: null
      mlag_password: null
      evpn_route_server_password: null
  dc2:
    bgp:
      underlay_password: null
      overlay_password: null
      mlag_password: null
      evpn_route_server_password: null
  dc3:
    bgp:
      underlay_password: null
      overlay_password: null
      mlag_password: null
      evpn_route_server_password: null
